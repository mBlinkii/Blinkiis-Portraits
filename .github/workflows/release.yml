name: Release

# Runs on every version tag, e.g.: git tag v1.53 && git push origin v1.53
#
# The pattern is "v[0-9]*" and not "v*": legacy tags in this repo are named
# "ver.1.36", which "v*" would match too - "${GITHUB_REF_NAME#v}" then yields
# "er.1.36" instead of a version.
#
# A tag with the "-test" suffix (e.g. v1.56-test) is a dry run: draft
# prerelease, no CurseForge/Wago upload, Discord goes to the test webhook.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version, interface versions, and date
        id: meta
        run: |
          set -e
          ADDON="Blinkiis_Portraits"
          # Version comes from the git tag that triggered this run, so the
          # release/zip/CurseForge/Wago version always matches what was
          # tagged, even if a .toc's own "## Version:" line lags behind.
          RAW="${GITHUB_REF_NAME#v}"
          case "$RAW" in
            *-test)
              IS_TEST="true"
              VERSION="${RAW%-test}"
              ;;
            *)
              IS_TEST="false"
              VERSION="$RAW"
              ;;
          esac
          DATE_FILE=$(date +%d%m%Y)
          echo "test=${IS_TEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zipname=${ADDON}-v${VERSION}-${DATE_FILE}" >> "$GITHUB_OUTPUT"

          # A test run must never end up as "Latest" in the release list, and
          # action-gh-release wants these as strings.
          if [ "$IS_TEST" = "true" ]; then
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_name=Ver. ${VERSION} (TEST)" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "release_name=Ver. ${VERSION}" >> "$GITHUB_OUTPUT"
          fi

          # Keep the shipped .toc files in sync with the tag, even if the
          # committed "## Version:" line wasn't bumped before tagging.
          for TOC in "$ADDON"/"$ADDON"_*.toc; do
            sed -i "s/^## Version:.*/## Version: ${VERSION}/" "$TOC"
          done

          # Convert every flavor's "## Interface:" (5 or 6 digit WoW
          # interface number, e.g. 120007 or 38001) into a dotted CurseForge/
          # Wago version (12.0.7 / 3.80.1) and collect them all, since a
          # single zip in this repo covers every flavor at once - this is
          # what makes the CurseForge/Wago listing cover every WoW version
          # instead of just retail.
          #
          # Wago's upload API wants the version split into one
          # "supported_<flavor>_patch" field per flavor rather than a single
          # combined list, so each .toc's version is also kept per-flavor
          # here. Mapping is the same one Wago itself uses to read a
          # project's .toc filename suffix (see /api/data/game
          # "toc_suffixes"): _Mainline->retail, _Mists->mop, _Cata->cata,
          # _TBC->bc, _Vanilla->classic, _Wrath->wotlk.
          VERSIONS=""
          RETAIL_PATCH=""
          MOP_PATCH=""
          CATA_PATCH=""
          BC_PATCH=""
          CLASSIC_PATCH=""
          WOTLK_PATCH=""
          for TOC in "$ADDON"/"$ADDON"_*.toc; do
            IFACE=$(grep -oP '^## Interface:\s*\K.+' "$TOC" | tr -d '\r ')
            IFS=',' read -ra ARR <<< "$IFACE"
            for I in "${ARR[@]}"; do
              V="$((10#$I / 10000)).$(((10#$I % 10000) / 100)).$((10#$I % 100))"
              case "$VERSIONS" in
                *"$V"*) ;;
                *) VERSIONS="${VERSIONS:+$VERSIONS,}$V" ;;
              esac
              case "$TOC" in
                *_Mainline.toc) RETAIL_PATCH="$V" ;;
                *_Mists.toc) MOP_PATCH="$V" ;;
                *_Cata.toc) CATA_PATCH="$V" ;;
                *_TBC.toc) BC_PATCH="$V" ;;
                *_Vanilla.toc) CLASSIC_PATCH="$V" ;;
                *_Wrath.toc) WOTLK_PATCH="$V" ;;
              esac
            done
          done
          echo "game_versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "retail_patch=$RETAIL_PATCH" >> "$GITHUB_OUTPUT"
          echo "mop_patch=$MOP_PATCH" >> "$GITHUB_OUTPUT"
          echo "cata_patch=$CATA_PATCH" >> "$GITHUB_OUTPUT"
          echo "bc_patch=$BC_PATCH" >> "$GITHUB_OUTPUT"
          echo "classic_patch=$CLASSIC_PATCH" >> "$GITHUB_OUTPUT"
          echo "wotlk_patch=$WOTLK_PATCH" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Copy this version's section body from CHANGELOG.md: everything
          # between its "## [ver. x.y.z]" heading and the next "## [" heading.
          # Matching on "## [ver. x.y.z]" keeps the date suffix working
          # regardless of its exact format.
          awk -v ver="$VERSION" '
            /^## \[/ { insec = (index($0, "## [ver. " ver "]") == 1); next }
            insec { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Trim leading blank lines.
          sed -i '/./,$!d' RELEASE_NOTES.md

          # Every release must ship its changelog on GitHub/CurseForge/Wago,
          # so a missing section is a hard error, not a silent fallback.
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No section for version ${VERSION} found in CHANGELOG.md (expected a '## [ver. ${VERSION}] - ...' heading) - add it before tagging." >&2
            exit 1
          fi

          echo "Release notes for v${VERSION}:"
          cat RELEASE_NOTES.md

          # Expose the notes as a (multi-line) step output for action inputs.
          # The extra "echo" before each delimiter guarantees the delimiter
          # starts on its own line even when the file lacks a trailing
          # newline - otherwise GitHub fails with "Matching delimiter not
          # found".
          {
            echo "body<<NOTES_EOF"
            cat RELEASE_NOTES.md
            echo ""
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          # CurseForge stores changelogs natively as HTML; markdown sent
          # through its API renders lossy (newlines collapse, "#"/backticks
          # get escaped), so the CurseForge upload gets a proper HTML
          # conversion instead.
          pip install --quiet markdown
          python3 -m markdown RELEASE_NOTES.md > RELEASE_NOTES.html

          {
            echo "body_html<<NOTES_EOF"
            cat RELEASE_NOTES.html
            echo ""
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      # The libraries are not tracked in the repo, they are fetched fresh on
      # every release. Only the modules listed in Blinkiis_Portraits/libs/
      # embeds.xml are pulled - keep both lists in sync when adding a library.
      - name: Fetch Ace3 + helper libraries into libs/
        run: |
          set -e
          LIBS="Blinkiis_Portraits/libs"
          mkdir -p "$LIBS"

          svn export --force https://repos.curseforge.com/wow/libstub/trunk "$LIBS/LibStub"
          svn export --force https://repos.curseforge.com/wow/callbackhandler/trunk/CallbackHandler-1.0 "$LIBS/CallbackHandler-1.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceAddon-3.0 "$LIBS/AceAddon-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceEvent-3.0 "$LIBS/AceEvent-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceConsole-3.0 "$LIBS/AceConsole-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceLocale-3.0 "$LIBS/AceLocale-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceDB-3.0 "$LIBS/AceDB-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceDBOptions-3.0 "$LIBS/AceDBOptions-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceGUI-3.0 "$LIBS/AceGUI-3.0"
          svn export --force https://repos.curseforge.com/wow/ace3/trunk/AceConfig-3.0 "$LIBS/AceConfig-3.0"

          git clone --depth 1 https://github.com/rossnichols/LibSerialize.git "$LIBS/LibSerialize"
          rm -rf "$LIBS/LibSerialize/.git"
          git clone --depth 1 https://github.com/SafeteeWoW/LibDeflate.git "$LIBS/LibDeflate"
          rm -rf "$LIBS/LibDeflate/.git"

      - name: Build zip
        run: |
          # The README only documents how to populate libs/ locally and has no
          # business in the shipped archive.
          rm -f Blinkiis_Portraits/libs/README.md
          # Zip from the repo root, referencing the folder by name, so
          # "Blinkiis_Portraits/" itself is the top-level entry in the
          # archive (required for WoW/CurseForge/Wago - not just its
          # contents).
          zip -r "${{ steps.meta.outputs.zipname }}.zip" "Blinkiis_Portraits" -x "Blinkiis_Portraits/.git*" -x "*/.svn/*"

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.release_name }}
          files: ${{ steps.meta.outputs.zipname }}.zip
          # Release notes come from CHANGELOG.md (see the notes step above)
          # instead of auto-generated commit lists.
          body_path: RELEASE_NOTES.md
          # A "-test" tag stays a draft prerelease so nothing shows up for
          # users; without an explicit make_latest a release would otherwise
          # be flagged as "Latest".
          draft: ${{ steps.meta.outputs.test == 'true' }}
          prerelease: ${{ steps.meta.outputs.test == 'true' }}
          make_latest: ${{ steps.meta.outputs.make_latest }}

      - name: Upload to CurseForge
        if: steps.meta.outputs.test != 'true'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: "1164560"
          game_endpoint: wow
          file_path: ${{ steps.meta.outputs.zipname }}.zip
          display_name: Ver. ${{ steps.meta.outputs.version }}
          game_versions: ${{ steps.meta.outputs.game_versions }}
          release_type: release
          changelog: ${{ steps.notes.outputs.body_html }}
          changelog_type: html

      - name: Upload to Wago Addons
        if: steps.meta.outputs.test != 'true'
        run: |
          # Build the metadata JSON with jq (correct escaping of the
          # multi-line markdown changelog) and write it to a file. It is
          # passed to curl as '-F "metadata=<file"', which sends the raw
          # file content as the field value - passing the JSON inline would
          # let curl interpret commas, semicolons and newlines inside it as
          # -F syntax and corrupt the field (Wago then rejects it with
          # "metadata must be a valid JSON string").
          #
          # Only flavors this addon actually ships a .toc for end up with a
          # non-empty patch value, so each "supported_<flavor>_patch" field
          # is added conditionally - sending an empty string for a flavor
          # that isn't built would list a bogus, unsupported version on Wago.
          jq -n \
            --arg label "${{ steps.meta.outputs.version }}" \
            --arg retail "${{ steps.meta.outputs.retail_patch }}" \
            --arg mop "${{ steps.meta.outputs.mop_patch }}" \
            --arg cata "${{ steps.meta.outputs.cata_patch }}" \
            --arg bc "${{ steps.meta.outputs.bc_patch }}" \
            --arg classic "${{ steps.meta.outputs.classic_patch }}" \
            --arg wotlk "${{ steps.meta.outputs.wotlk_patch }}" \
            --rawfile changelog RELEASE_NOTES.md \
            '{label: $label, stability: "stable", changelog: $changelog}
             + (if $retail  != "" then {supported_retail_patch: $retail}   else {} end)
             + (if $mop     != "" then {supported_mop_patch: $mop}         else {} end)
             + (if $cata    != "" then {supported_cata_patch: $cata}       else {} end)
             + (if $bc      != "" then {supported_bc_patch: $bc}           else {} end)
             + (if $classic != "" then {supported_classic_patch: $classic} else {} end)
             + (if $wotlk   != "" then {supported_wotlk_patch: $wotlk}     else {} end)' \
            > wago_metadata.json

          # "|| true" keeps the step alive under "bash -e" when curl fails
          # at the network level (exit != 0, HTTP_CODE "000"), so status and
          # body are still printed and the check below produces a clear
          # failure.
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -F "metadata=<wago_metadata.json" \
            -F "file=@${{ steps.meta.outputs.zipname }}.zip" \
            -H "Authorization: Bearer ${{ secrets.WAGO_API_TOKEN }}" \
            -H "Accept: application/json" \
            "https://addons.wago.io/api/projects/j6jzo56R/version") || true

          echo "HTTP status: ${HTTP_CODE:-000}"
          echo "Response body:"
          cat response.json 2>/dev/null || echo "(no response body)"
          echo

          if [ "${HTTP_CODE:-0}" -lt 200 ] || [ "${HTTP_CODE:-0}" -ge 300 ]; then
            echo "Wago upload failed." >&2
            exit 1
          fi

      # Last step on purpose: Discord is announced only after the release and
      # both uploads went through.
      #
      # No "github.event.release.prerelease" check here - this workflow is
      # triggered by "push: tags", so no release event object exists and the
      # expression would always be null. The tag pattern already does the
      # filtering: the rolling "dev" tag never starts this workflow, and
      # "-test" tags are routed to the test webhook below.
      #
      # Discord must never turn the workflow red.
      - name: Announce on Discord
        continue-on-error: true
        env:
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TEST_WEBHOOK: ${{ secrets.DISCORD_TEST_WEBHOOK }}
          IS_TEST: ${{ steps.meta.outputs.test }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -e

          # The webhook is picked in the shell, not in a GitHub expression: an
          # unset test secret is an empty string, and "a && b || c" would
          # silently fall back to the production webhook.
          if [ "$IS_TEST" = "true" ]; then
            # DISCORD_TEST_WEBHOOK is optional - without it a test run posts to
            # the release channel, recognisable by the "[TEST]" title prefix.
            WEBHOOK="${TEST_WEBHOOK:-$RELEASE_WEBHOOK}"
            SECRET_NAME="DISCORD_TEST_WEBHOOK/DISCORD_RELEASE_WEBHOOK"
            TITLE="[TEST] Blinkii's Portraits - Ver. ${VERSION}"
          else
            WEBHOOK="$RELEASE_WEBHOOK"
            SECRET_NAME="DISCORD_RELEASE_WEBHOOK"
            TITLE="Blinkii's Portraits - Ver. ${VERSION}"
          fi

          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Secret ${SECRET_NAME} is not set - skipping Discord announcement."
            exit 0
          fi

          # The changelog goes into the payload via --rawfile only. Inlining it
          # into the shell string would break the JSON on quotes and backticks
          # from the changelog. 3800 chars stays below Discord's 4096 limit for
          # embed descriptions.
          jq -n \
            --arg title "$TITLE" \
            --arg url "$RELEASE_URL" \
            --arg thumb "https://raw.githubusercontent.com/mBlinkii/Blinkiis-Portraits/main/icon.png" \
            --rawfile notes RELEASE_NOTES.md \
            '{embeds: [{
               title: $title,
               url: $url,
               description: ($notes | .[0:3800]),
               color: 50943,
               thumbnail: {url: $thumb}
             }]}' > discord_payload.json

          # --data-binary, not -d: -d strips newlines from the file.
          HTTP_CODE=$(curl -s -o discord_response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            --data-binary @discord_payload.json \
            "$WEBHOOK") || true

          echo "HTTP status: ${HTTP_CODE:-000}"
          cat discord_response.txt 2>/dev/null || true
          echo

          if [ "${HTTP_CODE:-0}" -lt 200 ] || [ "${HTTP_CODE:-0}" -ge 300 ]; then
            echo "::warning::Discord announcement failed (HTTP ${HTTP_CODE:-000})."
            exit 1
          fi
